<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Sticker Swap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4f5f7;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 1.5rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #1b6ca8 0%, #16c79a 100%);
      border-radius: 9px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.06);
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .pill {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 100px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      margin-bottom: 0.875rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }

    .error-banner {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
    }

    input[type="email"],
    input[type="password"] {
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      color: #111827;
      font-size: 0.9375rem;
      outline: none;
      padding: 0.625rem 0.875rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
      background: white;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #1b6ca8;
      box-shadow: 0 0 0 3px rgba(27, 108, 168, 0.12);
    }

    input::placeholder { color: #9ca3af; }

    .btn-submit {
      background: linear-gradient(135deg, #1b6ca8 0%, #16a085 100%);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-top: 0.625rem;
      padding: 0.75rem;
      width: 100%;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-submit:hover  { opacity: 0.92; }
    .btn-submit:active { transform: scale(0.99); }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 1.5rem 0 1rem;
    }

    .links {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .links a {
      color: #1b6ca8;
      font-size: 0.8125rem;
      text-decoration: none;
    }

    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="brand">
  <div class="brand-icon"></div>
  <span class="brand-name">Sticker Swap</span>
</div>

<div class="card">
  <span class="pill">Copa 2026</span>
  <h1>Entrar</h1>
  <p class="subtitle">Acesse sua conta para continuar suas trocas.</p>

  <div class="error-banner" th:if="${param.error}">
    E-mail ou senha incorretos. Tente novamente.
  </div>

  <form th:action="@{/login}" method="post">
    <div class="field">
      <label for="username">E-mail</label>
      <input id="username" name="username" type="email"
             autocomplete="email" placeholder="seu@email.com" required autofocus />
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" placeholder="••••••••" required />
    </div>

    <button class="btn-submit" type="submit">Entrar</button>
  </form>

  <hr class="divider" />

  <div class="links">
    <a th:href="${passwordResetUrl}">Esqueci minha senha</a>
    <a th:href="${registerUrl}">Criar conta</a>
  </div>
</div>

</body>
</html>
