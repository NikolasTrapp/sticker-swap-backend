import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'com.google.cloud.tools.jib' version '3.5.3'
    id 'jacoco'
    id 'org.sonarqube' version '7.3.0.8198'
}

group = 'br.com.stickerswap'
version = '0.0.1'
description = 'Plataforma de troca de figurinhas'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()

    finalizedBy jacocoTestReport
}

repositories {
    mavenCentral()
}

def testcontainersVersion = '1.21.4'

dependencies {
    // ── Spring Boot BOM (native Gradle platform) ───────────────
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)

    // ── Spring Boot Starters ───────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.aspectj:aspectjweaver'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // ── Flyway ─────────────────────────────────────────────────
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── OpenAPI / Swagger ──────────────────────────────────────
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // ── Observability ──────────────────────────────────────────
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // ── Database ───────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'

    // ── Lombok ─────────────────────────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ── MapStruct ──────────────────────────────────────────────
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // ── Test ───────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testImplementation "org.testcontainers:junit-jupiter:$testcontainersVersion"
    testImplementation "org.testcontainers:postgresql:$testcontainersVersion"
}

// ── Test ───────────────────────────────────────────────────────
tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// ── Jib (Docker image) ────────────────────────────────────────
jib {
    from {
        image = 'eclipse-temurin:25-jre-alpine'
    }
    to {
        image = 'nikolastrapp/sticker-swap-backend'
        tags = [System.getenv('IMAGE_TAG'), 'latest'].findAll { it }
        auth {
            username = System.getenv('DOCKER_HUB_USERNAME') ?: ''
            password = System.getenv('DOCKER_HUB_TOKEN') ?: ''
        }
    }
    container {
        mainClass = 'br.com.stickerswap.StickerSwapBackendApplication'
        ports = ['8080']
        jvmFlags = [
            '-XX:+UseContainerSupport',
            '-XX:MaxRAMPercentage=75.0',
            '-Djava.security.egd=file:/dev/./urandom'
        ]
        creationTime = 'USE_CURRENT_TIMESTAMP'
        environment = [
            'SPRING_PROFILES_ACTIVE': 'prod'
        ]
    }
}

jacoco {
    toolVersion = '0.8.14'
}

def jacocoExclusions = [
    '**/mapper/*Impl.class',
    '**/StickerSwapBackendApplication.class',
    '**/BrevoMailProvider$*.class',
    '**/ResendMailProvider$*.class',
    '**/CepGeocodeService$CepApiResponse.class',
    '**/CepGeocodeService$CoordinatesWrapper.class',
    '**/CepGeocodeService$LocationWrapper.class'
]

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }

    violationRules {
        rule {
            element = 'BUNDLE'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }

            limit {
                counter = 'CLASS'
                value = 'MISSEDCOUNT'
                maximum = 0
            }
        }
    }
}

check {
    dependsOn jacocoTestCoverageVerification
}

sonar {
    properties {
        property 'sonar.projectKey', 'NikolasTrapp_sticker-swap-backend'
        property 'sonar.organization', 'nikolastrapp'
        property 'sonar.host.url', 'https://sonarcloud.io'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.java.source', '25'
        property 'sonar.qualitygate.wait', 'true'
        property 'sonar.qualitygate.timeout', '300'
        property 'sonar.exclusions', [
            '**/StickerSwapBackendApplication.java',
            '**/mapper/*Impl.java'
        ].join(',')
    }
}

tasks.named('sonar') { dependsOn jacocoTestReport }
